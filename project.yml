name: Plainword

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  PlainwordCore:
    path: .

settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${PLAINWORD_DEVELOPMENT_TEAM}"
    PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).Plainword"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Plainword:
    type: application
    platform: macOS
    sources:
      - path: Sources/PlainwordApp
      - path: Resources/SharedAssets.xcassets
    info:
      path: Configuration/Plainword-Info.plist
      properties:
        CFBundleDisplayName: Plainword
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
    dependencies:
      - package: PlainwordCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).Plainword"
        INFOPLIST_KEY_CFBundleDisplayName: Plainword
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Plainword:
    build:
      targets:
        Plainword: all

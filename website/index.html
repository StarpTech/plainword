<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Plainword — AI writing assistant for every macOS app</title>
    <meta
      name="description"
      content="Fix, rewrite or draft text in any macOS app with one shortcut. Plainword reads the context around your cursor and runs on your own model. Free, open source."
    />
    <link rel="canonical" href="https://plainword.app/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Icons ------------------------------------------------------------ -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/app-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#EFE9DD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191612" media="(prefers-color-scheme: dark)" />

    <!-- A stored theme choice, applied before the first paint so the page never
         flashes the other one. Absent, the system preference stands. -->
    <script>
      try {
        var pwTheme = localStorage.getItem('pw-theme');
        if (pwTheme === 'light' || pwTheme === 'dark') {
          document.documentElement.dataset.theme = pwTheme;
        }
      } catch (e) {}
    </script>

    <!-- Sharing ----------------------------------------------------------
         One 1200x630 card, absolute URL, declared dimensions: LinkedIn, Slack,
         X, Facebook, iMessage and WhatsApp all read some subset of this. Rebuild
         it with `npm run og` after changing og/og-cover.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plainword" />
    <meta property="og:url" content="https://plainword.app/" />
    <meta property="og:title" content="Plainword — Say what you mean, wherever you write" />
    <meta
      property="og:description"
      content="Fix, rewrite or draft text right where you type it — in your tone, on your model, with the conversation around your cursor for context. Free and open source, for macOS."
    />
    <meta property="og:image" content="https://plainword.app/images/og-cover.png" />
    <meta property="og:image:secure_url" content="https://plainword.app/images/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Plainword on macOS: a sentence with three typos, and the app's popover proposing the corrected version."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plainword — Say what you mean, wherever you write" />
    <meta
      name="twitter:description"
      content="Fix, rewrite or draft text right where you type it — in your tone, on your model. Free and open source, for macOS."
    />
    <meta name="twitter:image" content="https://plainword.app/images/og-cover.png" />
    <meta
      name="twitter:image:alt"
      content="Plainword on macOS: a sentence with three typos, and the app's popover proposing the corrected version."
    />

    <meta name="apple-mobile-web-app-title" content="Plainword" />

    <!-- Fonts ------------------------------------------------------------ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..800&family=Fragment+Mono:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data ---------------------------------------------------
         Only claims the page actually backs up: what it is, what it costs, what
         it runs on. No ratings, no invented review counts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://plainword.app/#website",
            "url": "https://plainword.app/",
            "name": "Plainword",
            "description": "AI writing assistant for every macOS app.",
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://plainword.app/#app",
            "name": "Plainword",
            "url": "https://plainword.app/",
            "applicationCategory": "ProductivityApplication",
            "applicationSubCategory": "Writing assistant",
            "operatingSystem": "macOS 14 or newer",
            "softwareVersion": "1.0.0-beta.5",
            "downloadUrl": "https://github.com/StarpTech/plainword/releases/latest",
            "installUrl": "https://plainword.app/",
            "image": "https://plainword.app/images/og-cover.png",
            "screenshot": "https://plainword.app/images/og-cover.png",
            "license": "https://github.com/StarpTech/plainword/blob/main/LICENSE",
            "isAccessibleForFree": true,
            "description": "Plainword fixes, rewrites and drafts text in the app you are already typing in. One shortcut proposes an edit, nothing changes until you accept it, and it runs on your own model — local Ollama, a Codex subscription, or any OpenAI-compatible provider.",
            "featureList": [
              "Corrects and rewrites text in place, in any macOS app",
              "Reads the conversation around the cursor for context",
              "Writes in your own tone, style and language",
              "Runs fully locally with Ollama, or on any OpenAI-compatible model",
              "Proposes every edit before it changes anything",
              "Review and transform shortcuts you can rebind",
              "Pause suggestions, or exclude individual apps"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "availability": "https://schema.org/InStock"
            },
            "codeRepository": "https://github.com/StarpTech/plainword"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Plainword — say what you mean, wherever you write</h1>
      <p>
        Plainword is a free, open-source writing assistant for macOS 14 or newer. Press one
        shortcut in any text field and it fixes, rewrites or drafts what you are writing, in
        your own tone, using the conversation around your cursor for context. Nothing changes
        until you accept the proposal, and it runs on the model you choose — local Ollama, your
        Codex subscription, or any OpenAI-compatible provider.
      </p>
      <p><a href="https://github.com/StarpTech/plainword">Plainword on GitHub</a></p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
